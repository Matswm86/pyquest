name: build-android

# Builds the PyQuest debug APK, attaches it to the rolling "latest" pre-release
# and points the README download link at the build that just ran.
#
# Nothing is built on a workstation: Gradle needs more memory than the dev box
# has. CI is the only place an APK is produced.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate curriculum JSON
        run: python3 tools/validate_curriculum.py

  build:
    needs: curriculum
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK after this commit
        run: |
          set -euo pipefail
          # A fixed filename on the rolling "latest" release is cached hard by
          # browsers and by Android, so phones keep installing an old build. The
          # commit SHA in the filename makes every build its own URL.
          APK_FILE="pyquest-${GITHUB_SHA:0:7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          ls -lh "$APK_FILE"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyquest-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Update rolling "latest" pre-release (main pushes)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (rolling)
          prerelease: true
          body: |
            Auto-built APK from the latest `main` commit (${{ github.sha }}).

            **Install on a phone:** download `${{ env.APK_FILE }}`, open it, and
            allow "install from this source" when Android asks. Android 8.0 or
            newer (minSdk 26). The filename carries the commit id so your browser
            cannot serve you a cached older build.

            Debug-signed. If you are reinstalling over a build with a different
            signature, uninstall the old one first.
          files: ${{ env.APK_FILE }}
          fail_on_unmatched_files: true

      # The filename changes every build, so a link typed into README.md by hand
      # is stale as soon as the next build lands. This step rewrites it and
      # pushes with a skip-ci marker so the bump does not trigger another build.
      - name: Point README at the APK this build produced (main pushes)
        if: github.ref == 'refs/heads/main'
        env:
          APK_FILE: ${{ env.APK_FILE }}
        run: |
          set -euo pipefail
          # Work off the current tip of main rather than this run's checkout, so a
          # concurrent push loses the race loudly instead of silently reverting.
          git checkout -- . 2>/dev/null || true
          git fetch --depth=1 origin main
          git checkout -B _readme_bump FETCH_HEAD
          python3 - "$APK_FILE" <<'EOF'
          import re
          import sys

          apk = sys.argv[1]
          text = open("README.md", encoding="utf-8").read()
          out = re.sub(r"pyquest-[0-9a-f]{7,40}\.apk", apk, text)
          open("README.md", "w", encoding="utf-8").write(out)
          print("README unchanged" if out == text else f"README -> {apk}")
          EOF
          if git diff --quiet -- README.md; then
            echo "README already points at ${APK_FILE}"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "README: download link -> ${APK_FILE} [skip ci]"
          # Losing the race is harmless: the next build corrects the link.
          git push origin _readme_bump:main \
            || echo "push rejected (main moved), the next build will correct the README"

      - name: Create tagged release (vX.Y.Z tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            PyQuest ${{ github.ref_name }}. Sideload only, debug-signed.
          files: ${{ env.APK_FILE }}
          fail_on_unmatched_files: true

  # The app has to actually start. A green compile says nothing about whether the
  # first frame renders, and a crash at launch is invisible to every other job
  # here, so this one boots a real emulator, opens the app and reads the log.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            chmod +x ./gradlew
            ./gradlew installDebug --no-daemon
            mkdir -p smoke
            adb logcat -c || true
            # `am start -W` waits for the launch to settle, and a crash-restart
            # loop makes that wait forever: the first run of this job burned 28
            # minutes here and captured nothing. Cap it and keep going, because
            # the log is the point of this job, not the exit code of am.
            timeout 90 adb shell am start -n no.mwmai.pyquest.debug/no.mwmai.pyquest.MainActivity \
              || echo "am start did not return cleanly (exit $?)"
            sleep 15
            adb logcat -d > smoke/logcat.txt || true
            adb exec-out screencap -p > smoke/launch.png || true
            adb shell dumpsys activity activities > smoke/activities.txt || true
            wc -l smoke/logcat.txt || true
            if grep -qE "FATAL EXCEPTION|AndroidRuntime: .*Exception" smoke/logcat.txt; then
              echo "::error::App crashed at launch"
              grep -A 40 -m 1 "FATAL EXCEPTION" smoke/logcat.txt || true
              exit 1
            fi
            if ! grep -q "no.mwmai.pyquest.debug" smoke/activities.txt; then
              echo "::error::App is not in the activity stack after launch"
              tail -60 smoke/logcat.txt || true
              exit 1
            fi
            echo "App launched and is running."

      - name: Upload logcat and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyquest-smoke
          path: smoke/
          if-no-files-found: warn
